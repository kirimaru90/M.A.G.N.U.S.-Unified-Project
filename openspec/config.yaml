schema: spec-driven

context: |
  Monorepo "Unified MAGNUS": one product, three separately-deployed apps under apps/.
  The apps share one domain but keep their own folder, package.json, build, and deploy.
  Capabilities are prefixed by their owning app so provenance is clear in a flat namespace:
    - api-*      NestJS backend (apps/api)
    - cms-*      backoffice / content-authoring SPA (apps/cms)
    - emulator-* player-facing Fallout terminal emulator (apps/terminal)

  Shared domain concepts (described from each app's angle under its own prefix):
  campaigns, terminals (a JSON node/choice graph, "olonastri"), users, auth, and the
  game state engine.

  emulator app specifics: Vanilla HTML5 / CSS3 / JavaScript with no build step, marked.js
  via CDN, served by Docker + nginx. Italian UI, docs, and example content. No backend, no
  framework, no transpilation — pure static files. Manifest-driven JSON content loaded at
  runtime.

# OpenSpec rules are global to this folder. The rules below originate from the emulator app
# and apply specifically to emulator-* spec work; scope them by that prefix when authoring.
rules:
  proposal:
    - For emulator-* specs - proposals must not require changes to index.html unless the
      feature cannot be achieved via content/data alone.
    - For emulator-* specs - always include impact on the content-creator workflow (JSON
      authoring experience).
    - For emulator-* specs - reference Fallout lore-accurate naming where appropriate.

    # Testing: every change must plan its tests up front.
    - For all specs - the proposal MUST include a "Testing" section naming the behaviors
      under test and the layer (unit / integration / e2e). A change that genuinely cannot
      be tested must state why, explicitly.
    - For api-* specs - state which behaviors get unit specs (src/**/*.spec.ts) and which
      need e2e (test/*.e2e-spec.ts) against the in-memory Mongo (mongodb-memory-server; no
      external DB).
    - For cms-* specs - state which components/services get specs. If the Vitest runner is
      not yet wired, the proposal must depend on enable-cms-testing.
    - For emulator-* specs - state how the change is verified by an automated Playwright
      test that loads index.html and asserts on the live DOM. This supersedes manual
      browser checks wherever practical; if the Playwright harness is not yet present,
      depend on enable-emulator-testing.
  tasks:
    - For emulator-* specs - each task must be independently verifiable by opening
      index.html in a browser.
    - For emulator-* specs - data/schema changes must include an example JSON snippet.
    - For emulator-* specs - keep tasks scoped to one logical change (engine, manifest, or
      content layer).

    # Testing: tests are mandatory task steps; apply is not done until green.
    - For all specs - every task group that adds or changes behavior MUST include a paired
      test task in the same change. A change is NOT complete, and MUST NOT be archived,
      while any test is red.
    - For api-* specs - the final task MUST run `npm test` from apps/api/api and, when
      endpoints or persistence change, `npm run test:e2e`, confirming all pass. Changed
      files MUST meet >= 80% line coverage via `npm run test:cov`.
    - For cms-* specs - the final task MUST run `npm test` from apps/cms and confirm pass,
      meeting >= 70% line coverage. Requires the Vitest runner; blocked until
      enable-cms-testing is archived.
    - For emulator-* specs - the final task MUST run `npx playwright test` from
      apps/terminal and confirm all pass. Requires Playwright; blocked until
      enable-emulator-testing is archived.
