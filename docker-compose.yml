services:
  # 1. API SERVER
  api:
    build:
      context: ./apps/api/api
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4280,http://localhost:8081}
    depends_on:
      - mongo
    restart: unless-stopped

  # 2. DATABASE
  mongo:
    image: mongo:7
    env_file:
      - ./apps/api/.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 3. CMS
  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    ports:
      - "4280:80"
    restart: unless-stopped

  # 4. FRONTEND (Your 'terminal' project)
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/terminal:/usr/share/nginx/html
    restart: unless-stopped

  # 5. PIP-BOY (character-sheet PWA)
  pip-boy:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./apps/pip-boy:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  mongo_data: