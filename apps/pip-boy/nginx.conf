server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every shell asset the service worker precaches (sw.js itself, plus
    # everything under REQUIRED_SHELL_URLS/OPTIONAL_SHELL_URLS) must always be
    # revalidated so a changed deploy reaches installed clients instead of
    # being masked by the browser's HTTP cache. no-cache (revalidate every
    # use), not no-store. Once the service worker controls the page these
    # assets are served cache-first from Cache Storage anyway, so this adds
    # no meaningful cost — it only closes the window before that happens.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
