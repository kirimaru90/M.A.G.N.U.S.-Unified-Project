server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service-worker script must always be revalidated so a changed
    # CACHE_VERSION reaches installed clients instead of being masked by an
    # HTTP cache. no-cache (revalidate every use), not no-store.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
